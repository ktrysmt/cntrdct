[package]
name = "cntrdct-cli"
description = "Command-line interface for the cntrdct linter."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "cntrdct"
path = "src/main.rs"

[[bin]]
name = "cargo-cntrdct"
path = "src/cargo_subcommand.rs"

[dependencies]
cntrdct-core = { workspace = true }
cntrdct-detector-clone-drift = { workspace = true }
cntrdct-detector-arg-swap = { workspace = true }
cntrdct-detector-comment-code = { workspace = true }
cntrdct-detector-unreachable-after-terminator = { workspace = true }
cntrdct-detector-config-interaction = { workspace = true }
cntrdct-parsers = { workspace = true }
cntrdct-sarif = { workspace = true }
cntrdct-ranker = { workspace = true }
cntrdct-calibration = { workspace = true }
cntrdct-adjudicator-llm = { workspace = true }
cntrdct-eval = { workspace = true }
cntrdct-config = { workspace = true }
cntrdct-corpus-fetch = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
clap = { version = "4", features = ["derive"] }
walkdir = "2"
dirs = "5"
rayon = { workspace = true }
fastrand = "2"

[dev-dependencies]
tempfile = "3"
mockito = "1"
rayon = { workspace = true }
flate2 = "1"
tar = "0.4"
serde_json = { workspace = true }
