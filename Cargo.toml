[package]
name = "cntrdct"
version = "0.2.0-beta.1"
edition = "2021"
license = "MIT"
authors = ["cntrdct contributors"]
description = "Evidence-based contradiction linter for Rust and Python."
repository = "https://github.com/ktrysmt/cntrdct"
homepage = "https://github.com/ktrysmt/cntrdct"
readme = "README.md"
keywords = ["linter", "static-analysis", "rust", "contradiction", "evidence-based"]
categories = ["development-tools", "command-line-utilities"]
exclude = [
    "research/",
    "benchmarks/wild-corpus/",
    "benchmarks/wild-corpus-python/",
    "benchmarks/labelled-findings.jsonl",
    "prereg/",
    "docs/",
    "data/",
    "scripts/",
]

# cargo-binstall: download pre-built release archives from
# GitHub Releases instead of compiling from source. T3-14.
# The archive layout is `cntrdct-v{version}-{target}/{cntrdct,cargo-cntrdct}`,
# tar.gz on Linux/macOS and zip on Windows; see
# `.github/workflows/release.yml` for the producer side.
[package.metadata.binstall]
pkg-url = "{repo}/releases/download/v{version}/{name}-v{version}-{target}.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{name}-v{version}-{target}/{bin}{binary-ext}"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{repo}/releases/download/v{version}/{name}-v{version}-{target}.zip"
pkg-fmt = "zip"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cntrdct"
path = "src/main.rs"

[[bin]]
name = "cargo-cntrdct"
path = "src/cargo_subcommand.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rayon = "1"
toml = "0.8"
globset = "0.4"
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
dirs = "5"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
mockito = "1"
serde_json = "1"
