[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/detector-clone-drift",
    "crates/detector-arg-swap",
    "crates/detector-comment-code",
    "crates/detector-unreachable-after-terminator",
    "crates/detector-config-interaction",
    "crates/sarif",
    "crates/ranker",
    "crates/calibration",
    "crates/eval",
    "crates/adjudicator-llm",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["cntrdct contributors"]
repository = ""

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
