[workspace]
resolver = "2"
members = [
    "corpus-fetch",
    "cli-research",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["cntrdct contributors"]
repository = "https://github.com/ktrysmt/cntrdct"
homepage = "https://github.com/ktrysmt/cntrdct"
readme = "README.md"
keywords = ["empirical-study", "corpus", "research"]
categories = ["development-tools"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rayon = "1"
cntrdct-corpus-fetch = { path = "corpus-fetch", version = "0.2.0" }
