# git-cliff configuration for cntrdct
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
Generated by [git-cliff](https://git-cliff.org) from
[Conventional Commits](https://www.conventionalcommits.org).
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}]\
    {% if previous %}\
        {% if previous.version %}\
            (https://github.com/ktrysmt/cntrdct/compare/{{ previous.version }}..{{ version }})\
        {% endif %}\
    {% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}({{ commit.scope }}) {% endif %}\
          {{ commit.message | upper_first | split(pat="\n") | first }}\
          {% if commit.id %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/ktrysmt/cntrdct/commit/{{ commit.id }})){% endif %}
    {% endfor %}
{% endfor %}
"""
footer = ""
trim = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat",          group = "Features" },
  { message = "^fix",           group = "Bug Fixes" },
  { message = "^perf",          group = "Performance" },
  { message = "^refactor",      group = "Refactor" },
  { message = "^promote",       group = "Promotions (research -> technical)" },
  { message = "^docs",          group = "Documentation" },
  { message = "^test",          group = "Tests" },
  { message = "^ci",            group = "CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(changelog\\)", skip = true },
  { message = "^chore",         group = "Chores" },
  { message = "^Merge",         skip = true },
]
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "newest"
