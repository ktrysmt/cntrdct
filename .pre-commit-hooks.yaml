# pre-commit hook definitions for cntrdct.
# https://pre-commit.com/
#
# Usage (in a downstream repo's .pre-commit-config.yaml):
#
#   repos:
#     - repo: https://github.com/ktrysmt/cntrdct
#       rev: v0.14.0        # pin to a release tag
#       hooks:
#         - id: cntrdct
#           # optional: ratchet against a committed baseline
#           # args: [scan, ., --baseline, cntrdct-baseline.json, --fail-on, warning]
#
# The hook builds the cntrdct binary from this repository via cargo
# (pre-commit's `rust` language), then scans the whole tree. Whole-tree
# scanning (pass_filenames: false) is deliberate: several detectors
# (clone-drift, pr-miner) need cross-file context, so a staged-files-only
# scan would silently miss findings. The scan respects `.gitignore` (I-1,
# docs/spec/scan-ignore-v0.md), so `target/` / `node_modules/` stay out;
# add `--no-ignore` to args to scan ignored files too. Use a baseline
# (see docs/spec/baseline-v0.md) to keep whole-tree scans quiet in large
# repos.
#
# The hook triggers when a staged file matches one of cntrdct's supported
# extensions. A `files` regex is used rather than `types_or` tags so the
# trigger set is pinned to the exact extensions cntrdct routes to a parser
# (see README "Language support"), independent of the pre-commit `identify`
# tag vocabulary.
- id: cntrdct
  name: cntrdct
  description: Evidence-based contradiction linter (whole-tree scan).
  entry: cntrdct
  args: [scan, ., --fail-on, warning]
  language: rust
  pass_filenames: false
  files: '\.(rs|py|pyi|ts|mts|cts|tsx|go)$'
  minimum_pre_commit_version: "2.9.2"
