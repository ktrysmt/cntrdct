version: 3
# files:
#   - pattern: action.yaml
#   - pattern: */action.yaml

# separator: "  # "

ignore_actions:
  # dtolnay/rust-toolchain ships only floating refs (stable, beta, nightly,
  # 1.NN.M). Pinning to a SHA freezes the Rust toolchain forever, defeating
  # the action's stated purpose.
  - name: dtolnay/rust-toolchain
    ref: stable
