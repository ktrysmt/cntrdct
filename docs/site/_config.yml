title: cntrdct
description: Evidence-based contradiction linter for Rust
author: cntrdct contributors

url: "https://ktrysmt.github.io"
baseurl: "/cntrdct"

theme: minima
markdown: kramdown
permalink: pretty

defaults:
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

plugins:
  - jekyll-seo-tag
