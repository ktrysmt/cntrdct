# Publish the cntrdct container image to GitHub Packages (ghcr.io).
#
# Triggers on every `v*` tag push (alongside release.yml) and on manual
# dispatch so an already-cut release can be (re)published. The image is
# built straight from the repo's Dockerfile with the plain docker CLI
# (buildx) — no third-party build actions, so nothing here needs SHA
# pinning beyond actions/checkout and the first-party upload/download
# -artifact steps used to shuttle per-arch digests between jobs.
#
# Published tags (multi-arch manifest list, linux/amd64 + linux/arm64):
#   ghcr.io/ktrysmt/cntrdct:X.Y.Z   (always)
#   ghcr.io/ktrysmt/cntrdct:latest  (only for non-prerelease versions)
#
# Each architecture is built on its OWN native runner (amd64 on
# ubuntu-latest, arm64 on the free ubuntu-24.04-arm hosted runner) and
# pushed to ghcr by digest only — no QEMU emulation, so the arm64 Rust
# release build runs at native speed. A final `merge` job stitches the
# two per-arch digests into one manifest list with `docker buildx
# imagetools create` and applies the human-readable tags.
name: Publish Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.14.0). Required for manual runs."
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Resolve image ref
        id: img
        env:
          REPO: ${{ github.repository }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # Lowercase the image ref (ghcr requires it; the owner/name can
          # carry uppercase).
          image="ghcr.io/$(echo "${REPO}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          # Sanitise the platform for use in an artifact name
          # (linux/amd64 -> linux-amd64; slashes are illegal there).
          echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" \
            | docker login ghcr.io -u "${ACTOR}" --password-stdin

      - name: Set up buildx builder
        # push-by-digest / name-canonical need the image exporter, which
        # the default `docker` driver does not support — create a
        # docker-container builder. No QEMU: this runner only ever builds
        # its own native platform.
        run: docker buildx create --use --name cntrdct-builder --driver docker-container

      - name: Build and push by digest
        id: build
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "${PLATFORM}" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json \
            .
          digest="$(jq -r '.["containerimage.digest"]' metadata.json)"
          if [[ -z "${digest}" || "${digest}" == "null" ]]; then
            echo "::error::buildx did not report a containerimage.digest"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          # Encode the digest in the filename; the merge job reconstructs
          # "${IMAGE}@sha256:<name>" from it.
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ steps.img.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifests and push tags
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ -z "${version}" ]]; then
            echo "::error::could not resolve version from tag '${TAG}'"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          image="ghcr.io/$(echo "${REPO}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          # Tag :latest only for a final release (no pre-release suffix).
          if [[ "${version}" == *-* ]]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download digests
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" \
            | docker login ghcr.io -u "${ACTOR}" --password-stdin

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.ver.outputs.image }}
          VERSION: ${{ steps.ver.outputs.version }}
          PUSH_LATEST: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          tags=(-t "${IMAGE}:${VERSION}")
          if [[ "${PUSH_LATEST}" == "true" ]]; then
            tags+=(-t "${IMAGE}:latest")
          fi
          # Each file in this dir is named after a per-arch manifest
          # digest; turn them back into "${IMAGE}@sha256:<digest>" refs.
          sources=()
          for d in *; do
            sources+=("${IMAGE}@sha256:${d}")
          done
          if [[ ${#sources[@]} -eq 0 ]]; then
            echo "::error::no per-arch digests were downloaded"
            exit 1
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          echo "Published ${IMAGE}:${VERSION}$( [[ "${PUSH_LATEST}" == "true" ]] && echo ' and :latest' ) (linux/amd64 + linux/arm64)" >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect manifest
        env:
          IMAGE: ${{ steps.ver.outputs.image }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
