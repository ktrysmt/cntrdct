name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0). Required for manual runs."
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: install cross
        if: matrix.use_cross
        run: cargo install --locked cross

      - name: build (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release -p cntrdct --target ${{ matrix.target }}

      - name: build (cross)
        if: matrix.use_cross
        run: cross build --release -p cntrdct --target ${{ matrix.target }}

      - name: package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          stage="cntrdct-${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}-${{ matrix.target }}"
          mkdir -p "dist/${stage}"
          cp "target/${{ matrix.target }}/release/cntrdct" "dist/${stage}/"
          cp "target/${{ matrix.target }}/release/cargo-cntrdct" "dist/${stage}/"
          cp LICENSE README.md "dist/${stage}/"
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          (cd dist && shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256")

      - name: package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "${{ github.event.inputs.tag }}" }
          $stage = "cntrdct-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$stage" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/cntrdct.exe" "dist/$stage/"
          Copy-Item "target/${{ matrix.target }}/release/cargo-cntrdct.exe" "dist/$stage/"
          Copy-Item LICENSE,README.md "dist/$stage/"
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip"
          $hash = Get-FileHash "dist/$stage.zip" -Algorithm SHA256
          "$($hash.Hash.ToLower())  $stage.zip" | Out-File -Encoding ascii "dist/$stage.zip.sha256"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cntrdct-${{ matrix.target }}
          path: dist/cntrdct-*.${{ matrix.archive }}*
          if-no-files-found: error

  release:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: list artifacts
        run: ls -la dist
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cntrdct-*.tar.gz
            dist/cntrdct-*.tar.gz.sha256
            dist/cntrdct-*.zip
            dist/cntrdct-*.zip.sha256
          draft: false
          generate_release_notes: true
