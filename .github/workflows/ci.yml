name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-test:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --all-targets
      - name: examples smoke test
        run: |
          ./examples/01_scan.sh > /dev/null
          ./examples/02_calibrate.sh > /dev/null
          ./examples/03_adjudicate_mock.sh > /dev/null

  licenses:
    name: cargo-deny licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  sarif:
    name: SARIF schema (OASIS 2.1.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: install sarif-multitool
        run: dotnet tool install --global Sarif.Multitool
      - name: build cntrdct
        run: cargo build --release -p cntrdct-cli
      - name: emit + validate sample SARIF
        run: |
          ./target/release/cntrdct scan benchmarks/corpus/files \
              --format sarif \
              --no-calibration > /tmp/sample.sarif
          export PATH="$HOME/.dotnet/tools:$PATH"
          sarif validate /tmp/sample.sarif
