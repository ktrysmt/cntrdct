name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt (technical workspace)
        run: cargo fmt --all -- --check
      - name: rustfmt (research workspace)
        working-directory: research
        run: cargo fmt --all -- --check
      # Q-2: guard against placeholder URLs (e.g. github.com/TBD/cntrdct)
      # leaking into production SARIF output. The previous SARIF
      # informationUri shipped as `https://github.com/TBD/cntrdct` for
      # several releases; this grep ensures the regression cannot recur.
      - name: no placeholder URLs in src/
        run: |
          if grep -RnE 'TBD' src/; then
            echo "::error::placeholder string 'TBD' found in src/; replace with the real value before merging" >&2
            exit 1
          fi
      # Q-10: detectors must not depend on `tree_sitter_*` directly.
      # All parsing entry points go through `cntrdct::parsers::parser_for`
      # so adding a future M-7+ language is a single-module change.
      - name: parser seam (no tree_sitter_*::language() in src/detectors/)
        run: |
          if grep -REn 'tree_sitter_[a-z_]+::language\(\)' src/detectors/; then
            echo "::error::detectors must call cntrdct::parsers::parser_for(...).ts_language() instead of tree_sitter_*::language() directly" >&2
            exit 1
          fi

  clippy-test:
    name: clippy + test (technical, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # T3-12: clippy --all-targets does not exercise the cntrdct-lsp
      # binary, the `lsp` module, or `tests/lsp_smoke.rs` because they
      # all gate on the `lsp` feature (the binary via `required-features`,
      # the module via `cfg(feature = "lsp")`). Run the lsp-feature
      # build explicitly so a future change to the library API that
      # breaks the LSP module fails CI rather than silently rotting.
      - name: clippy (lsp feature)
        run: cargo clippy --features lsp --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --all-targets
      # Phase 1.b smoke test (`tests/lsp_smoke.rs`) and the `lsp::tests`
      # unit module are gated on the `lsp` feature, so the previous step
      # skips them. Two invocations because the smoke test name does not
      # contain "lsp", so we cannot share a single name filter with the
      # `lsp::tests` lib selection.
      - name: test (lsp feature, smoke)
        run: cargo test --features lsp --test lsp_smoke
      - name: test (lsp feature, unit)
        run: cargo test --features lsp --lib lsp::tests
      - name: examples smoke test
        run: |
          ./examples/01_scan.sh > /dev/null
          ./examples/02_calibrate.sh > /dev/null
          ./examples/03_adjudicate_mock.sh > /dev/null

  research-clippy-test:
    name: clippy + test (research, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: research
      - name: clippy (research workspace)
        working-directory: research
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (research workspace)
        working-directory: research
        run: cargo test --workspace --all-targets

  licenses:
    name: cargo-deny licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  sarif:
    name: SARIF schema (OASIS 2.1.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: install sarif-multitool
        run: dotnet tool install --global Sarif.Multitool
      - name: build cntrdct
        run: cargo build --release -p cntrdct
      - name: emit + validate sample SARIF
        run: |
          ./target/release/cntrdct scan benchmarks/corpus/files \
              --format sarif \
              --no-calibration > /tmp/sample.sarif
          export PATH="$HOME/.dotnet/tools:$PATH"
          sarif validate /tmp/sample.sarif

  network-isolation:
    name: telemetry-free assurance (T3-16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build cntrdct
        run: cargo build --release -p cntrdct
      # T3-16: the scan path must complete with no network access.
      # `sudo unshare --net` creates a fresh network namespace with no
      # outbound routes (only a `lo` interface, and it's down by
      # default). If any code path in `cntrdct scan` makes an
      # unexpected network call, the call fails with `ENETUNREACH` /
      # `EAI_*` inside the namespace and the job goes red. The reqwest
      # dependency is constrained to `src/adjudicator.rs` (gated by
      # the explicit `--adjudicate` flag), so the scan path here
      # exercises everything that runs by default for end-users:
      # walker -> parsers -> Layer 1 detectors -> Layer 2 ranker ->
      # Layer 4 SARIF emitter.
      #
      # `sudo` (rather than the unprivileged `unshare -r`) is needed
      # because Ubuntu 24.04's AppArmor `unprivileged_userns` profile
      # blocks `/proc/self/uid_map` writes from non-root processes on
      # GitHub-hosted runners. Sudo is passwordless on GHA runners.
      # `--no-calibration` skips the per-user priors cache so the
      # process needs no `$HOME` access; the embedded priors are
      # baked into the binary via `include_str!`.
      - name: cntrdct scan succeeds inside isolated network namespace
        run: |
          set -euo pipefail
          sudo unshare --net ./target/release/cntrdct \
              scan benchmarks/corpus/files \
              --format sarif --no-calibration \
              > /tmp/isolated.sarif
          test -s /tmp/isolated.sarif
          python3 -c "import json; json.load(open('/tmp/isolated.sarif'))"
          echo "::notice::cntrdct scan completed with no network access"
