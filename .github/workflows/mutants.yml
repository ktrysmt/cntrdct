name: cargo-mutants nightly

# Q-16: nightly mutation testing on src/detectors/. Validates that
# detector judgement boundaries (e.g. MIN_FN_TOKENS,
# NEAR_DUPLICATE_THRESHOLD, MIN_TRANSACTION_ITEMS) are exercised by
# the test suite rather than memorised. The aggregate catch-rate
# gate enforces >= 80% on Layer 1 detectors; below the gate, the
# gate job fails and the missed mutants surface in the run summary
# so a human can prioritise the gap.
#
# The run is sharded across 8 parallel jobs. A single unsharded job
# stopped fitting once the detector tree grew past the ~3.7k LOC this
# workflow was written against (it is 6.8k LOC today, after the Go /
# TypeScript / Python detector ports). Run 30437082088 (2026-07-29)
# found 1076 mutants and was killed by the runner after 5h33m with two
# files still untested, so neither the catch-rate gate nor the artifact
# upload ever ran. Sharded, run 30472236875 measured 43-74 min per
# shard, i.e. roughly 8h of work serially -- comfortably past the 6h
# ceiling a hosted runner can offer at all.
#
# cargo-mutants' default `slice` sharding splits by mutant *count*
# (`chunk_size = total.div_ceil(n)` in its src/shard.rs), so shards
# come out evenly sized and `--sharding round-robin` is not needed:
# that run gave seven shards of 135 mutants and a remainder of 131.
#
# Some mutants allocate without bound, and those used to kill the whole
# job: the log ends in "the runner has received a shutdown signal", one
# to two minutes after the last reported outcome, with nothing written
# about why. Every observed instance -- runs 29904768145, 30079487162,
# 30256461379, 30343694415, 30437082088, and both attempts of shard 5 on
# run 30472236875 -- landed in `tokenize` in
# src/detectors/lang/go_build_tag_interaction.rs. Its `while i <
# chars.len()` loop advances `i` only inside the match arms, so
# mutating an `i += 1` in an arm that also pushes a token (lines 198,
# 202, 206, 211, 219) leaves `i` pinned while `tokens` grows every
# iteration. Measured at ~316 MB/s, which exhausts a 16 GB runner in
# under a minute -- faster than the ~210s test timeout can fire.
#
# CARGO_TARGET_<TRIPLE>_RUNNER wraps test-binary execution only (not
# rustc, not cargo), so an address-space cap there turns those mutants
# into ordinary caught mutants: the allocation fails, the test process
# aborts, cargo test exits non-zero. If the cap were ever too tight for
# a legitimate test, the unmutated baseline would fail first and exit 4
# would abort the shard loudly rather than reporting every mutant as
# caught.

on:
  schedule:
    # 06:00 UTC daily. Decoupled from the per-PR `ci.yml` cadence
    # because cargo-mutants runs the full test suite once per
    # mutant and routinely exceeds 30 minutes.
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Shard count. Must stay in sync between the matrix, the --shard
  # argument, and the gate job's completeness check.
  SHARD_COUNT: "8"

concurrency:
  # A second nightly should not stack on top of an in-flight one.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    name: mutants (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # 43-74 min measured per shard on run 30472236875. The ceiling is
    # deliberately loose; it only has to catch a runaway, and a shard
    # that hits it is a signal to raise SHARD_COUNT.
    timeout-minutes: 150
    strategy:
      # One shard failing must not cancel the others: the gate job
      # needs every shard's counts to compute an aggregate rate.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # All shards restore the same registry/target cache; only
          # shard 0 saves it, so the eight jobs do not race to write
          # the same key.
          shared-key: mutants
          save-if: ${{ matrix.shard == 0 }}
      - name: install cargo-mutants
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2.77.6
        with:
          tool: cargo-mutants
      - name: cap test-binary memory
        # 4 GiB of address space per test binary. The whole suite runs in
        # a fraction of that, and with -j 2 the worst case is 8 GiB on a
        # 16 GB runner, leaving room for the builds and the agent.
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/mem-capped-test.sh" <<'WRAPPER'
          #!/usr/bin/env bash
          ulimit -v 4194304
          exec "$@"
          WRAPPER
          chmod +x "$RUNNER_TEMP/mem-capped-test.sh"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=$RUNNER_TEMP/mem-capped-test.sh" >> "$GITHUB_ENV"
      - name: run cargo-mutants
        # cargo-mutants exit codes (its src/exit_code.rs): 0 = every
        # viable mutant caught, 1 = usage error, 2 = some mutants
        # missed, 3 = some tests timed out, 4 = baseline already
        # failing, 5/6 = --in-diff problems, 70 = internal error.
        #
        # 2 and 3 are both normal here and are deferred to the gate
        # job. 3 in particular MUST NOT be fatal: LabOutcome::exit_code
        # (cargo-mutants src/outcome.rs) returns 3 in preference to 2,
        # and this tree reliably produces hanging mutants -- e.g.
        # `i += 1` -> `i *= 1` at src/detectors/clone_drift.rs:686,
        # inside `while i < a.len()`, and `!=` -> `==` at :707/:711 in
        # find_root_compress. Treating 3 as fatal is why the gate step
        # was skipped on every run that did finish.
        #
        # 4 stays fatal on purpose: with a broken baseline every mutant
        # looks caught, which would report a bogus 100% catch rate.
        run: |
          set +e
          cargo mutants --no-shuffle -j 2 --shard "${{ matrix.shard }}/${SHARD_COUNT}"
          status=$?
          set -e
          echo "cargo-mutants exit status: $status"
          case "$status" in
            0 | 2 | 3) ;;
            *)
              echo "::error::cargo-mutants returned $status (not 0, 2 or 3); see logs"
              exit "$status"
              ;;
          esac
      - name: upload shard outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-out-${{ matrix.shard }}
          path: mutants.out/
          retention-days: 30

  gate:
    name: catch-rate gate
    needs: mutants
    # Runs even when a shard failed, so the summary still shows the
    # partial picture; the completeness checks below then fail the job.
    # Not `always()`: a deliberately cancelled run (concurrency, manual
    # stop) should not leave a red gate job behind. A shard killed by
    # the runner or by timeout-minutes concludes 'failure', not
    # 'cancelled', so that case still reaches the gate.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: download shard outcomes
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: mutants-out-*
          # merge-multiple stays false so each shard lands in its own
          # shards/mutants-out-<k>/ directory.
          path: shards
      - name: compute catch rate and write summary
        env:
          MUTANTS_RESULT: ${{ needs.mutants.result }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          shard_dirs=(shards/mutants-out-*)
          found=${#shard_dirs[@]}
          # Expanded through `${a[@]+...}` everywhere below: with
          # nullglob the array is empty when no artifact arrived, and
          # a bare "${a[@]}" on an empty array trips `set -u` on older
          # bash. The zero-shard case has to reach the completeness
          # check, not die before it.

          # cargo-mutants creates caught/missed/unviable/timeout.txt up
          # front (its src/output.rs) and appends one `writeln!` line
          # per mutant, so `wc -l` is exact and an empty bucket really
          # is zero. A bucket that is absent means a truncated upload,
          # which must not be silently counted as zero. Checked here
          # rather than inside sum_bucket, because that runs in a
          # command substitution where `exit` would only leave the
          # subshell and the message would be captured as the count.
          for d in ${shard_dirs[@]+"${shard_dirs[@]}"}; do
            for bucket in caught missed unviable timeout; do
              if [ ! -f "$d/$bucket.txt" ]; then
                echo "::error::$d/$bucket.txt is missing; shard artifact is incomplete"
                exit 1
              fi
            done
          done

          sum_bucket() {
            local bucket="$1" total=0 n d
            for d in ${shard_dirs[@]+"${shard_dirs[@]}"}; do
              n=$(wc -l < "$d/$bucket.txt" | tr -d ' ')
              total=$((total + n))
            done
            echo "$total"
          }

          caught=$(sum_bucket caught)
          missed=$(sum_bucket missed)
          unviable=$(sum_bucket unviable)
          timeout=$(sum_bucket timeout)

          # Timed-out and unviable mutants are excluded from the
          # denominator: neither yields a verdict about the tests.
          total_eval=$((caught + missed))
          if [ "$total_eval" -eq 0 ]; then
            rate_pct="0.0"
            gate_passed=0
          else
            rate_pct=$(awk -v c="$caught" -v t="$total_eval" \
              'BEGIN { printf "%.1f", (c/t)*100 }')
            gate_passed=$(awk -v c="$caught" -v t="$total_eval" \
              'BEGIN { print (c/t >= 0.80) ? 1 : 0 }')
          fi

          {
            echo "# cargo-mutants nightly (Q-16)"
            echo
            echo "Scope: src/detectors/ (per .cargo/mutants.toml)"
            echo
            echo "Shards reporting: ${found}/${SHARD_COUNT}"
            echo "Shard jobs result: ${MUTANTS_RESULT}"
            echo
            echo "| Outcome | Count |"
            echo "|---|---|"
            echo "| Caught | $caught |"
            echo "| Missed | $missed |"
            echo "| Unviable | $unviable |"
            echo "| Timeout | $timeout |"
            echo
            echo "Catch rate: ${rate_pct}% (gate >= 80.0%)"
            if [ "$missed" -gt 0 ]; then
              echo
              echo "## Missed mutants"
              echo
              echo '```'
              cat shards/mutants-out-*/missed.txt
              echo '```'
            fi
            if [ "$timeout" -gt 0 ]; then
              echo
              echo "## Timed-out mutants"
              echo
              echo '```'
              cat shards/mutants-out-*/timeout.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Completeness first: a rate computed from a subset of the
          # shards would understate or overstate the real one.
          if [ "$found" -ne "$SHARD_COUNT" ]; then
            echo "::error::only ${found}/${SHARD_COUNT} shard artifacts present; catch rate is not representative"
            exit 1
          fi
          if [ "$MUTANTS_RESULT" != "success" ]; then
            echo "::error::shard jobs concluded '${MUTANTS_RESULT}'; catch rate is not representative"
            exit 1
          fi
          if [ "$gate_passed" -ne 1 ]; then
            echo "::error::catch rate ${rate_pct}% is below the 80% gate"
            exit 1
          fi
          echo "::notice::catch rate ${rate_pct}% meets the 80% gate"
